services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: print_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d print_manager"]
      interval: 1s
      timeout: 3s
      retries: 30

  # SQS-compatible queue for local development and tests.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "9324:9324" # SQS API
      - "9325:9325" # web UI
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  pgdata:
